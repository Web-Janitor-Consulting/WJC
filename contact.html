<section class="contact-page">
    <header class="contact-header page-header">
        <h1>Let's talk</h1>
        <p>Tell me what you're working on. A rough idea is fine—we'll figure out the details together.</p>
    </header>

    <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <p class="hidden" aria-hidden="true">
            <label>Don't fill this out: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
        </p>

        <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
        </div>

        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
        </div>

        <div class="form-field">
            <label for="message">What are you working on?</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="button">Send it</button>
        </div>
    </form>
</section>
