---
layout: layouts/default.html
title: Contact
eleventyNavigation:
  key: Contact
  order: 5
---

<section class="contact-page">
    <header class="contact-header page-header">
        <h1>Let's talk</h1>
        <p>Tell me what you're working on. A rough idea is fine—we'll figure out the details together.</p>
    </header>

    <div class="contact-thanks" id="contact-thanks" hidden>
        <p>Message sent! I'll be in touch soon.</p>
    </div>
    <div class="contact-error" id="contact-error" hidden>
        <p>Something went wrong. Please try again or email me directly.</p>
    </div>

    <!-- Netlify Forms — the live site still runs on Netlify; the Workers
         /api/contact handler stays in-repo for when that migration lands. -->
    <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field"
        action="/contact/?sent=1">
        <p class="hidden" aria-hidden="true">
            <label>Don't fill this out: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
        </p>

        <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
        </div>

        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
        </div>

        <div class="form-field">
            <label for="message">What are you working on?</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="button">Send it</button>
        </div>
    </form>
</section>

<script>
(function () {
    var p = new URLSearchParams(location.search);
    if (p.get('sent') === '1') {
        document.getElementById('contact-thanks').hidden = false;
        document.querySelector('.contact-form').hidden = true;
    } else if (p.get('error') === '1') {
        document.getElementById('contact-error').hidden = false;
    }
}());
</script>
