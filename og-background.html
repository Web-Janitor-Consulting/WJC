<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OG Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            background-image:
                linear-gradient(90deg,
                    transparent 0%,
                    transparent 12%,
                    rgb(243, 197, 147) 12%,
                    rgb(243, 197, 147) calc(12% + 2px),
                    transparent calc(12% + 2px),
                    transparent calc(12% + 6px),
                    rgb(243, 197, 147) calc(12% + 6px),
                    rgb(243, 197, 147) calc(12% + 8px),
                    transparent calc(12% + 8px),
                    transparent 100%),
                linear-gradient(180deg, rgb(251, 238, 159) 100px, transparent 80px),
                repeating-linear-gradient(180deg,
                    rgb(201, 215, 152) 0px,
                    rgb(201, 215, 152) 2px,
                    transparent 2px,
                    transparent 32px),
                linear-gradient(rgb(251, 238, 159), rgb(251, 238, 159));
        }
    </style>
</head>

<body></body>

</html>
