<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sponsor Tile</title>
    <style>
        /* 600x500 Tampa Monitor sponsor tile — screenshot this page at
           600x500 to produce the image. Matches the site palette. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: "DM Sans";
            font-style: normal;
            font-weight: 400 700;
            src: url("/assets/fonts/dm-sans-latin.woff2") format("woff2");
        }

        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 400;
            src: url("/assets/fonts/inter-regular.woff2") format("woff2");
        }

        html,
        body {
            width: 600px;
            height: 500px;
            overflow: hidden;
        }

        body {
            background: #faf8f2;
            color: #16181d;
            border-top: 10px solid #d2202e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile {
            text-align: center;
            padding: 0 48px;
        }

        .tile-illustration {
            width: 250px;
            margin: 0 auto 30px;
        }

        .tile-illustration svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .tile-illustration .bucket,
        .tile-illustration .sign,
        .tile-illustration .puddle {
            fill: #16181d;
        }

        .tile-illustration .www,
        .tile-illustration .code {
            fill: #d2202e;
        }

        h1 {
            font-family: "DM Sans", sans-serif;
            font-weight: 700;
            font-size: 56px;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .kicker {
            width: 80px;
            height: 8px;
            border-radius: 2px;
            background: #d2202e;
            margin: 24px auto;
        }

        .url {
            font-family: "DM Sans", sans-serif;
            font-weight: 600;
            font-size: 30px;
            color: #d2202e;
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div class="tile">
        <div class="tile-illustration">
            {% include "bucket-sign.html" %}
        </div>
        <h1>Web Janitor Consulting</h1>
        <div class="kicker"></div>
        <p class="url">webjanitor.consulting</p>
    </div>
</body>

</html>
